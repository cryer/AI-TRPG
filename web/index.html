<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AI-TRPG · 单人语音跑团</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, rgba(64,52,90,.55) 0%, transparent 55%),
      radial-gradient(ellipse 90% 70% at 50% 115%, rgba(120,72,32,.28) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 45%, #131722 0%, #0b0e16 55%, #060810 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none; color: #d8cdb4;
  }

  /* ---- 漂浮的余烬 ---- */
  .ember {
    position: fixed; bottom: -8px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(224,180,92,.9) 0%, rgba(224,180,92,0) 70%);
    animation: rise linear infinite;
    opacity: 0;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
    12%  { opacity: .8; }
    85%  { opacity: .25; }
    100% { transform: translateY(-104vh) translateX(var(--drift)) scale(.4); opacity: 0; }
  }

  /* ---- 标题区 ---- */
  header { text-align: center; margin-bottom: 6px; z-index: 2; }
  header h1 {
    font-family: "STKaiti", "KaiTi", "Noto Serif SC", "Songti SC", serif;
    font-size: 34px; font-weight: 700; letter-spacing: .35em; text-indent: .35em;
    color: #e6d5ac;
    text-shadow: 0 0 22px rgba(224,180,92,.35), 0 2px 6px rgba(0,0,0,.8);
  }
  header .sub {
    margin-top: 8px; font-size: 12.5px; letter-spacing: .28em; text-indent: .28em;
    color: rgba(216,205,180,.5);
  }
  header .rule {
    width: 190px; height: 1px; margin: 12px auto 0;
    background: linear-gradient(90deg, transparent, rgba(201,168,106,.65), transparent);
    position: relative;
  }
  header .rule::after {
    content: ""; position: absolute; left: 50%; top: -3px; width: 7px; height: 7px;
    transform: translateX(-50%) rotate(45deg);
    background: #c9a86a; box-shadow: 0 0 8px rgba(224,180,92,.8);
  }

  /* ---- 法阵舞台 ---- */
  #stage { position: relative; width: 340px; height: 340px; margin-top: 4px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #sigil {
    position: absolute; inset: 18px; pointer-events: none;
    animation: spin 90s linear infinite; opacity: .5;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #btn {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 108px; height: 108px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(201,168,106,.55);
    background:
      radial-gradient(circle at 35% 30%, rgba(201,168,106,.22) 0%, transparent 55%),
      linear-gradient(160deg, #232838 0%, #141824 60%, #0d101a 100%);
    color: #e0b45c;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 0 0 0 rgba(224,180,92,.4), 0 10px 36px rgba(0,0,0,.65),
                inset 0 0 18px rgba(0,0,0,.6);
    transition: color .3s, border-color .3s, box-shadow .3s, transform .1s;
    outline: none; font-family: inherit;
  }
  #btn:active { transform: translate(-50%,-50%) scale(.94); }
  #btn .cap {
    font-size: 11px; letter-spacing: .22em; text-indent: .22em;
    font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif; color: inherit; opacity: .85;
  }
  #btn.connecting { color: #e8c76a; animation: pulse-gold 1.2s ease-out infinite; }
  #btn.oncall {
    color: #9fb0e8; border-color: rgba(123,140,222,.55);
    animation: pulse-arcane 2.4s ease-out infinite;
  }
  @keyframes pulse-gold {
    0%   { box-shadow: 0 0 0 0 rgba(224,180,92,.45), 0 10px 36px rgba(0,0,0,.65), inset 0 0 18px rgba(0,0,0,.6); }
    100% { box-shadow: 0 0 0 28px rgba(224,180,92,0), 0 10px 36px rgba(0,0,0,.65), inset 0 0 18px rgba(0,0,0,.6); }
  }
  @keyframes pulse-arcane {
    0%   { box-shadow: 0 0 0 0 rgba(123,140,222,.35), 0 10px 36px rgba(0,0,0,.65), inset 0 0 18px rgba(0,0,0,.6); }
    100% { box-shadow: 0 0 0 32px rgba(123,140,222,0), 0 10px 36px rgba(0,0,0,.65), inset 0 0 18px rgba(0,0,0,.6); }
  }
  #btn svg { width: 40px; height: 40px; stroke: currentColor; fill: none;
             stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; }
  #btn .ico-exit { display: none; }
  #btn.oncall .ico-dice { display: none; }
  #btn.oncall .ico-exit { display: block; }

  /* ---- 状态判词 ---- */
  #status {
    margin-top: 22px; min-height: 22px; z-index: 2;
    font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
    font-size: 15.5px; letter-spacing: .18em; text-indent: .18em;
    color: rgba(230,213,172,.78); text-shadow: 0 1px 4px rgba(0,0,0,.7);
    transition: opacity .4s;
  }
  #status.dim { opacity: .55; }

  footer {
    position: fixed; bottom: 18px; left: 0; right: 0; text-align: center;
    font-size: 11px; letter-spacing: .3em; text-indent: .3em;
    color: rgba(216,205,180,.28); pointer-events: none;
  }

  /* ---- provider 切换开关（右上） ---- */
  #switches {
    position: fixed; top: 22px; right: 24px; display: flex; flex-direction: column;
    gap: 10px; z-index: 10;
  }
  .sw {
    display: flex; align-items: center; gap: 10px;
    background: rgba(14,17,26,.72); border: 1px solid rgba(201,168,106,.28);
    border-radius: 999px; padding: 5px 6px 5px 14px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 4px 18px rgba(0,0,0,.5);
    transition: opacity .2s;
  }
  .sw.loading { opacity: .45; pointer-events: none; }
  .sw-label {
    font-size: 12px; letter-spacing: .18em;
    font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
    color: rgba(216,205,180,.6);
  }
  .seg { position: relative; display: flex; background: rgba(0,0,0,.45); border-radius: 999px; padding: 3px; }
  .seg button {
    position: relative; z-index: 1; border: none; background: none; cursor: pointer;
    color: rgba(216,205,180,.5); font-size: 12px; padding: 5px 14px; border-radius: 999px;
    transition: color .25s; font-family: inherit;
  }
  .seg button.on { color: #141824; font-weight: 600; }
  .seg .ind {
    position: absolute; top: 3px; bottom: 3px; border-radius: 999px;
    background: linear-gradient(135deg, #e0b45c, #c9a86a);
    transition: left .28s cubic-bezier(.6,.1,.2,1.2), width .28s cubic-bezier(.6,.1,.2,1.2);
  }
  .sw.shake { animation: shake .35s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  @media (max-width: 480px) {
    header h1 { font-size: 26px; }
    #stage { width: 300px; height: 300px; }
    #switches { top: 12px; right: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>夜 话 跑 团</h1>
  <div class="sub">AI 主持人 · 单人语音跑团</div>
  <div class="rule"></div>
</header>

<div id="stage">
  <svg id="sigil" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(201,168,106,.35)" stroke-width=".5" stroke-dasharray="3 5"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(123,140,222,.22)" stroke-width=".4" stroke-dasharray="1 4"/>
    <polygon points="50,8 86,71 14,71" fill="none" stroke="rgba(201,168,106,.18)" stroke-width=".4"/>
    <polygon points="50,92 14,29 86,29" fill="none" stroke="rgba(123,140,222,.14)" stroke-width=".4"/>
  </svg>
  <canvas id="wave" width="680" height="680"></canvas>
  <button id="btn" aria-label="开始冒险">
    <svg class="ico-dice" viewBox="0 0 24 24">
      <path d="M12 2.5 L20.5 7.2 V16.8 L12 21.5 L3.5 16.8 V7.2 Z"/>
      <path d="M12 21.5 V12 M12 12 L3.5 7.2 M12 12 L20.5 7.2"/>
      <path d="M12 12 L7.75 19.15 M12 12 L16.25 19.15"/>
    </svg>
    <svg class="ico-exit" viewBox="0 0 24 24">
      <path d="M14 3.5 H5.5 V20.5 H14"/>
      <path d="M10.5 12 H21 M17.8 8.6 L21 12 L17.8 15.4"/>
    </svg>
    <span class="cap">开 启</span>
  </button>
</div>

<div id="status">掷下骰子，开启你的冒险</div>

<footer>自由行动 · 随时打断 · 你的选择决定结局</footer>

<div id="switches">
  <div class="sw" id="sw-asr">
    <span class="sw-label">识别</span>
    <div class="seg">
      <div class="ind"></div>
      <button data-v="sherpa">本地</button>
      <button data-v="volcengine">云端</button>
    </div>
  </div>
  <div class="sw" id="sw-tts">
    <span class="sw-label">合成</span>
    <div class="seg">
      <div class="ind"></div>
      <button data-v="cosyvoice">本地</button>
      <button data-v="volcengine">云端</button>
    </div>
  </div>
</div>

<script>
'use strict';
const btn = document.getElementById('btn');
const statusEl = document.getElementById('status');
const canvas = document.getElementById('wave');
const g = canvas.getContext('2d');
const W = canvas.width, H = canvas.height, CX = W / 2, CY = H / 2;
const R0 = 132;            // 波纹内半径（px，canvas 坐标 680x680）
const BARS = 72;

let state = 'idle';        // idle | connecting | incall
let ws = null, audioCtx = null, micStream = null, analyser = null;
let workletNode = null, zeroGain = null;
let playTime = 0, scheduled = [];
let userLevel = 0, agentLevel = 0;
const barVals = new Float32Array(BARS);

// ---------- 状态判词 ----------

function setStatus(text, dim) {
  if (statusEl.textContent !== text) statusEl.textContent = text;
  statusEl.classList.toggle('dim', !!dim);
}

// ---------- 余烬 ----------

(function embers() {
  for (let i = 0; i < 14; i++) {
    const e = document.createElement('div');
    e.className = 'ember';
    const size = 3 + Math.random() * 5;
    e.style.width = e.style.height = size + 'px';
    e.style.left = (5 + Math.random() * 90) + 'vw';
    e.style.setProperty('--drift', ((Math.random() - 0.5) * 160) + 'px');
    const dur = 9 + Math.random() * 14;
    e.style.animationDuration = dur + 's';
    e.style.animationDelay = (-Math.random() * dur) + 's';
    document.body.appendChild(e);
  }
})();

// ---------- 对局生命周期 ----------

async function startCall() {
  state = 'connecting';
  btn.className = 'connecting';
  setStatus('正在唤醒主持人……', true);
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    await audioCtx.audioWorklet.addModule('pcm-worklet.js');
    const src = audioCtx.createMediaStreamSource(micStream);

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);

    workletNode = new AudioWorkletNode(audioCtx, 'pcm-capture', {
      processorOptions: { sampleRate: audioCtx.sampleRate }
    });
    workletNode.port.onmessage = (e) => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(e.data);
    };
    zeroGain = audioCtx.createGain();
    zeroGain.gain.value = 0;
    src.connect(workletNode).connect(zeroGain).connect(audioCtx.destination);

    await new Promise((resolve, reject) => {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
      ws.binaryType = 'arraybuffer';
      ws.onopen = resolve;
      ws.onerror = reject;
      ws.onclose = () => { if (state !== 'idle') hangup(); };
      ws.onmessage = onWsMessage;
    });
    state = 'incall';
    btn.className = 'oncall';
    btn.querySelector('.cap').textContent = '离 开';
    setStatus('主持人已就位，洗耳恭听', false);
  } catch (err) {
    console.error(err);
    hangup();
  }
}

function hangup() {
  state = 'idle';
  btn.className = '';
  btn.querySelector('.cap').textContent = '开 启';
  setStatus('掷下骰子，开启你的冒险', false);
  if (ws) { try { ws.close(); } catch (e) {} ws = null; }
  stopPlayback();
  if (workletNode) { workletNode.disconnect(); workletNode = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
  userLevel = agentLevel = 0;
}

// ---------- 下行音频：播放 + 电平 ----------

function onWsMessage(e) {
  if (typeof e.data === 'string') {
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) { return; }
    if (msg.type === 'flush') stopPlayback();   // barge-in：立即静音
    return;
  }
  const i16 = new Int16Array(e.data);
  let sum = 0;
  const buf = audioCtx.createBuffer(1, i16.length, 16000);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < i16.length; i++) {
    const v = i16[i] / 32768;
    ch[i] = v;
    sum += v * v;
  }
  agentLevel = Math.min(1, Math.sqrt(sum / i16.length) * 5);

  const s = audioCtx.createBufferSource();
  s.buffer = buf;
  s.connect(audioCtx.destination);
  // 欠载重缓冲：本地 TTS 合成可能短时跟不上播放（hop 突发到达），
  // 重新对准时多留 0.3s 余量，让后续 chunk 攒出缓冲，避免反复卡顿
  if (playTime < audioCtx.currentTime) playTime = audioCtx.currentTime + 0.3;
  s.start(playTime);
  playTime += buf.duration;
  scheduled.push(s);
}

function stopPlayback() {
  scheduled.forEach(s => { try { s.stop(); } catch (e) {} });
  scheduled = [];
  playTime = 0;
  agentLevel = 0;
}

// ---------- 波纹动画 ----------

const micBuf = new Float32Array(256);
function sampleUserLevel() {
  if (!analyser) { userLevel *= 0.9; return; }
  analyser.getFloatTimeDomainData(micBuf);
  let sum = 0;
  for (let i = 0; i < micBuf.length; i++) sum += micBuf[i] * micBuf[i];
  const rms = Math.sqrt(sum / micBuf.length);
  userLevel = Math.max(Math.min(1, rms * 6), userLevel * 0.85);
}

let lastSpeaker = null;
function draw(t) {
  requestAnimationFrame(draw);
  g.clearRect(0, 0, W, H);
  if (state === 'idle') {
    // 待机：缓慢呼吸的暗金圆环
    const r = R0 + Math.sin(t / 900) * 4;
    g.beginPath();
    g.arc(CX, CY, r, 0, Math.PI * 2);
    g.strokeStyle = 'rgba(201,168,106,.22)';
    g.lineWidth = 3;
    g.stroke();
    lastSpeaker = null;
    return;
  }
  sampleUserLevel();
  agentLevel *= 0.94;
  const level = Math.max(userLevel, agentLevel);
  const speakingAgent = agentLevel > userLevel && agentLevel > 0.02;
  // 玩家=烛金，主持人=幽蓝，过渡色按电平占比
  const hue = speakingAgent ? 232 : 40;
  const sat = speakingAgent ? 55 : 70;
  const base = 6 + level * 64;

  // 状态判词跟随说话方
  const speaker = speakingAgent ? 'agent' : (userLevel > 0.05 ? 'user' : null);
  if (speaker !== lastSpeaker) {
    lastSpeaker = speaker;
    if (speaker === 'agent') setStatus('主持人正在讲述……', false);
    else if (speaker === 'user') setStatus('你在讲述自己的行动……', false);
    else setStatus('轮到你了——说出你的行动', false);
  }

  for (let i = 0; i < BARS; i++) {
    const wave = 0.55 + 0.45 * Math.sin(t / 260 + i * 0.55);
    const target = base * wave * (0.7 + 0.3 * Math.sin(t / 130 + i * 1.7));
    barVals[i] += (target - barVals[i]) * 0.35;
    const len = barVals[i];
    const a = (i / BARS) * Math.PI * 2 - Math.PI / 2;
    const x1 = CX + Math.cos(a) * R0, y1 = CY + Math.sin(a) * R0;
    const x2 = CX + Math.cos(a) * (R0 + 10 + len), y2 = CY + Math.sin(a) * (R0 + 10 + len);
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.strokeStyle = `hsla(${hue}, ${sat}%, ${55 + level * 20}%, ${0.35 + level * 0.6})`;
    g.lineWidth = 5;
    g.lineCap = 'round';
    g.stroke();
  }
}
requestAnimationFrame(draw);

btn.addEventListener('click', () => {
  if (state === 'idle') startCall();
  else hangup();
});

// ---------- provider 切换开关 ----------

function renderSwitch(el, active) {
  const btns = [...el.querySelectorAll('.seg button')];
  const ind = el.querySelector('.ind');
  btns.forEach(b => b.classList.toggle('on', b.dataset.v === active));
  const onBtn = btns.find(b => b.dataset.v === active);
  if (onBtn) {
    ind.style.left = onBtn.offsetLeft + 'px';
    ind.style.width = onBtn.offsetWidth + 'px';
  }
}

async function initSwitches() {
  const swAsr = document.getElementById('sw-asr');
  const swTts = document.getElementById('sw-tts');
  try {
    const r = await fetch('/api/providers');
    const st = await r.json();
    renderSwitch(swAsr, st.asr.active);
    renderSwitch(swTts, st.tts.active);
  } catch (e) { console.error('providers init failed', e); }

  for (const [el, slot] of [[swAsr, 'asr'], [swTts, 'tts']]) {
    el.querySelectorAll('.seg button').forEach(b => {
      b.addEventListener('click', async () => {
        const prev = el.querySelector('button.on').dataset.v;
        const next = b.dataset.v;
        if (next === prev) return;
        renderSwitch(el, next);              // 乐观更新
        el.classList.add('loading');         // 本地模型首次加载要数秒
        try {
          const r = await fetch('/api/providers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ [slot]: next })
          });
          if (!r.ok) throw new Error((await r.json()).error || r.status);
        } catch (err) {
          console.error('switch failed', err);
          renderSwitch(el, prev);            // 回滚
          el.classList.add('shake');
          setTimeout(() => el.classList.remove('shake'), 400);
        } finally {
          el.classList.remove('loading');
        }
      });
    });
  }
}
initSwitches();
</script>
</body>
</html>
